version: 0.0.1
kind: captain_toolset
name: Netlify
author: chatwoot
category: Engineering & status
description: Check Netlify sites, recent deploys, and whether the latest production deploy succeeded.

secrets:
  access_token:
    label: Netlify personal access token
    type: password
    required: true

tools:
  - id: list_sites
    title: List Sites
    description: List Netlify sites with their URL and the state of the deploy that is currently live, 20 at a time. Use this first to find the site ID the other Netlify tools need. Start with page 1.
    http_method: GET
    endpoint_url: https://api.netlify.com/api/v1/sites?filter=all&per_page=20&page={{ page | url_encode }}
    auth_type: bearer
    auth_config:
      token: ${{ secrets.access_token }}
    param_schema:
      - name: page
        type: integer
        description: The page number to fetch, starting at 1.
        required: true
    response_template: |-
      {% assign probe = response | join: "," %}{% if response.first.id %}{% for site in response %}- {{ site.name }} (site ID {{ site.id }}): {{ site.ssl_url | default: site.url }}{% if site.state %} · site {{ site.state }}{% endif %}{% if site.published_deploy.id %} · live deploy {{ site.published_deploy.state | default: "unknown" }}{% if site.published_deploy.published_at %}, published {{ site.published_deploy.published_at }}{% endif %}{% else %} · nothing published yet{% endif %}
      {% endfor %}{% elsif response.size == 0 and probe == "" and response != "" %}No sites found on this page.{% else %}Netlify returned an unexpected response.{% endif %}

  - id: get_site
    title: Get Site
    description: Read one Netlify site, including its domains and the deploy that is currently live. Use a site ID from List Sites, or the site's domain such as example.netlify.app.
    http_method: GET
    endpoint_url: https://api.netlify.com/api/v1/sites/{{ site_id | strip | url_encode }}
    auth_type: bearer
    auth_config:
      token: ${{ secrets.access_token }}
    param_schema:
      - name: site_id
        type: string
        description: The Netlify site ID from List Sites, or the site's domain without https://, such as example.netlify.app or www.example.com.
        required: true
    response_template: |-
      {% if response.id and response.name %}{{ response.name }} (site ID {{ response.id }})
      URL: {{ response.ssl_url | default: response.url }}{% if response.state %}
      Site state: {{ response.state }}{% endif %}{% if response.custom_domain %}
      Custom domain: {{ response.custom_domain }}{% endif %}{% if response.domain_aliases.size > 0 %}
      Domain aliases: {{ response.domain_aliases | join: ", " | truncate: 200 }}{% endif %}{% if response.account_name %}
      Team: {{ response.account_name }}{% endif %}{% if response.build_settings.repo_url %}
      Repository: {{ response.build_settings.repo_url }}{% if response.build_settings.repo_branch %} (branch {{ response.build_settings.repo_branch }}){% endif %}{% endif %}{% if response.published_deploy.id %}{% assign deploy = response.published_deploy %}
      Live deploy: {{ deploy.state | default: "unknown" }} (deploy ID {{ deploy.id }}){% if deploy.published_at %}, published {{ deploy.published_at }}{% endif %}{% if deploy.branch %}, branch {{ deploy.branch }}{% endif %}{% if deploy.title and deploy.title != "" %}
      Live deploy title: {{ deploy.title | truncate: 150 }}{% endif %}{% else %}
      Nothing has been published for this site yet.{% endif %}{% if response.updated_at %}
      Last updated: {{ response.updated_at }}{% endif %}{% else %}Netlify returned an unexpected response.{% endif %}

  - id: list_production_deploys
    title: List Production Deploys
    description: List the 5 most recent production deploys of a Netlify site with their state and any error. Use this to check whether the latest release succeeded when a customer reports a problem that may have started with a deploy.
    http_method: GET
    endpoint_url: https://api.netlify.com/api/v1/sites/{{ site_id | strip | url_encode }}/deploys?production=true&per_page=5
    auth_type: bearer
    auth_config:
      token: ${{ secrets.access_token }}
    param_schema:
      - name: site_id
        type: string
        description: The Netlify site ID from List Sites, or the site's domain without https://.
        required: true
    response_template: |-
      {% assign probe = response | join: "," %}{% if response.first.id %}{% for deploy in response %}- {{ deploy.created_at }} · {% case deploy.state %}{% when "ready" %}succeeded (ready){% when "error" %}failed{% else %}{{ deploy.state | default: "unknown" }}{% endcase %} (deploy ID {{ deploy.id }}){% if deploy.branch %} · branch {{ deploy.branch }}{% endif %}{% if deploy.commit_ref %} · commit {{ deploy.commit_ref | slice: 0, 7 }}{% endif %}{% if deploy.published_at %} · published {{ deploy.published_at }}{% endif %}{% if deploy.title and deploy.title != "" %}
        {{ deploy.title | truncate: 120 }}{% endif %}{% if deploy.error_message and deploy.error_message != "" %}
        Error: {{ deploy.error_message | truncate: 200 }}{% endif %}
      {% endfor %}{% elsif response.size == 0 and probe == "" and response != "" %}No production deploys found for this site.{% else %}Netlify returned an unexpected response.{% endif %}

  - id: list_site_deploys
    title: List Site Deploys
    description: List the 10 most recent deploys of a Netlify site across all contexts, including deploy previews and branch deploys. Returns deploy IDs for Get Deploy.
    http_method: GET
    endpoint_url: https://api.netlify.com/api/v1/sites/{{ site_id | strip | url_encode }}/deploys?per_page=10
    auth_type: bearer
    auth_config:
      token: ${{ secrets.access_token }}
    param_schema:
      - name: site_id
        type: string
        description: The Netlify site ID from List Sites, or the site's domain without https://.
        required: true
    response_template: |-
      {% assign probe = response | join: "," %}{% if response.first.id %}{% for deploy in response %}- {{ deploy.created_at }} · {{ deploy.context | default: "unknown context" }} · {{ deploy.state | default: "unknown" }} (deploy ID {{ deploy.id }}){% if deploy.branch %} · branch {{ deploy.branch }}{% endif %}{% if deploy.title and deploy.title != "" %}
        {{ deploy.title | truncate: 120 }}{% endif %}{% if deploy.error_message and deploy.error_message != "" %}
        Error: {{ deploy.error_message | truncate: 200 }}{% endif %}
      {% endfor %}{% elsif response.size == 0 and probe == "" and response != "" %}No deploys found for this site.{% else %}Netlify returned an unexpected response.{% endif %}

  - id: list_failed_deploys
    title: List Failed Deploys
    description: List the 5 most recent failed deploys of a Netlify site with their error messages. Use this when a customer says a change has not gone live or a deploy seems stuck.
    http_method: GET
    endpoint_url: https://api.netlify.com/api/v1/sites/{{ site_id | strip | url_encode }}/deploys?state=error&per_page=5
    auth_type: bearer
    auth_config:
      token: ${{ secrets.access_token }}
    param_schema:
      - name: site_id
        type: string
        description: The Netlify site ID from List Sites, or the site's domain without https://.
        required: true
    response_template: |-
      {% assign probe = response | join: "," %}{% if response.first.id %}{% for deploy in response %}- {{ deploy.created_at }} · {{ deploy.context | default: "unknown context" }} · {{ deploy.state | default: "unknown" }} (deploy ID {{ deploy.id }}){% if deploy.branch %} · branch {{ deploy.branch }}{% endif %}{% if deploy.title and deploy.title != "" %}
        {{ deploy.title | truncate: 120 }}{% endif %}{% if deploy.error_message and deploy.error_message != "" %}
        Error: {{ deploy.error_message | truncate: 300 }}{% endif %}
      {% endfor %}{% elsif response.size == 0 and probe == "" and response != "" %}No failed deploys found for this site.{% else %}Netlify returned an unexpected response.{% endif %}

  - id: get_deploy
    title: Get Deploy
    description: Read one Netlify deploy, including its state, context, branch, commit, URLs, and the error if it failed. Use a deploy ID from the Netlify deploy list tools or from Get Site.
    http_method: GET
    endpoint_url: https://api.netlify.com/api/v1/deploys/{{ deploy_id | strip | url_encode }}
    auth_type: bearer
    auth_config:
      token: ${{ secrets.access_token }}
    param_schema:
      - name: deploy_id
        type: string
        description: The Netlify deploy ID from List Production Deploys, List Site Deploys, List Failed Deploys, or Get Site.
        required: true
    response_template: |-
      {% if response.id and response.state %}{{ response.name }} deploy {{ response.id }}
      State: {% case response.state %}{% when "ready" %}succeeded (ready){% when "error" %}failed{% else %}{{ response.state }}{% endcase %}{% if response.skipped %} (skipped){% endif %}{% if response.context %}
      Context: {{ response.context }}{% endif %}{% if response.branch %}
      Branch: {{ response.branch }}{% endif %}{% if response.commit_ref %}
      Commit: {{ response.commit_ref | slice: 0, 7 }}{% if response.commit_url %} ({{ response.commit_url }}){% endif %}{% endif %}{% if response.title and response.title != "" %}
      Title: {{ response.title | truncate: 200 }}{% endif %}
      Created: {{ response.created_at }}{% if response.published_at %}
      Published: {{ response.published_at }}{% endif %}{% if response.error_message and response.error_message != "" %}
      Error: {{ response.error_message | truncate: 400 }}{% endif %}{% if response.deploy_ssl_url %}
      Deploy URL: {{ response.deploy_ssl_url }}{% endif %}{% if response.ssl_url %}
      Site URL: {{ response.ssl_url }}{% endif %}{% if response.locked %}
      Publishing is locked to this deploy.{% endif %}{% else %}Netlify returned an unexpected response.{% endif %}
