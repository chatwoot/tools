version: 0.0.1
kind: captain_toolset
name: GitHub
author: chatwoot
category: Engineering & status
description: Search issues, read issue discussions, and check releases in a GitHub repository.

headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: '2026-03-10'

inputs:
  owner:
    label: Repository owner
    placeholder: chatwoot
    required: true
  repo:
    label: Repository name
    placeholder: chatwoot
    required: true

secrets:
  access_token:
    label: GitHub personal access token
    type: password
    required: true

tools:
  - id: search_issues
    title: Search Issues
    description: Search issues in the connected GitHub repository to check whether a bug or feature request is already reported. Returns the 10 best matches. Use this first to get the issue number the other GitHub tools need.
    http_method: GET
    endpoint_url: https://api.github.com/search/issues?q={{ query | strip | url_encode }}+repo%3A${{ inputs.owner }}%2F${{ inputs.repo }}+is%3Aissue&per_page=10
    auth_type: bearer
    auth_config:
      token: ${{ secrets.access_token }}
    param_schema:
      - name: query
        type: string
        description: Keywords from the problem, such as "export csv timeout". Add is:open or is:closed to filter by state, or label:bug to filter by label.
        required: true
    response_template: |-
      {% if response.items %}{% for issue in response.items limit: 10 %}- #{{ issue.number }} {{ issue.title | truncate: 200 }}
        State: {{ issue.state }}{% if issue.state_reason %} ({{ issue.state_reason | replace: "_", " " }}){% endif %} · {{ issue.comments }} comments{% if issue.labels.size > 0 %} · Labels: {% for label in issue.labels limit: 8 %}{{ label.name }}{% unless forloop.last %}, {% endunless %}{% endfor %}{% endif %}
        Opened: {{ issue.created_at }} · Updated: {{ issue.updated_at }}
        Link: {{ issue.html_url }}
      {% else %}No issues match this search.
      {% endfor %}{% if response.total_count > 10 %}{{ response.total_count }} issues match in total. Only the top 10 are shown.{% endif %}{% else %}GitHub returned an unexpected response.{% endif %}

  - id: get_issue
    title: Get Issue
    description: Read one issue in the connected GitHub repository, including its state, labels, assignees, milestone, and description. Use the issue number from Search Issues or one the customer mentions.
    http_method: GET
    endpoint_url: https://api.github.com/repos/${{ inputs.owner }}/${{ inputs.repo }}/issues/{{ issue_number | url_encode }}
    auth_type: bearer
    auth_config:
      token: ${{ secrets.access_token }}
    param_schema:
      - name: issue_number
        type: integer
        description: The issue number without the # sign, such as 1234.
        required: true
    response_template: |-
      {% if response.number %}#{{ response.number }} {{ response.title | truncate: 300 }}{% if response.pull_request %} (pull request){% endif %}
      State: {{ response.state }}{% if response.state_reason %} ({{ response.state_reason | replace: "_", " " }}){% endif %}
      Opened: {{ response.created_at }} by {{ response.user.login | default: "unknown" }}
      Updated: {{ response.updated_at }}{% if response.closed_at %}
      Closed: {{ response.closed_at }}{% endif %}{% if response.labels.size > 0 %}
      Labels: {% for label in response.labels limit: 10 %}{{ label.name }}{% unless forloop.last %}, {% endunless %}{% endfor %}{% endif %}{% if response.assignees.size > 0 %}
      Assignees: {% for assignee in response.assignees limit: 5 %}{{ assignee.login }}{% unless forloop.last %}, {% endunless %}{% endfor %}{% endif %}{% if response.milestone.title %}
      Milestone: {{ response.milestone.title }}{% endif %}
      Comments: {{ response.comments }}
      Link: {{ response.html_url }}{% if response.body and response.body != "" %}
      Description: {{ response.body | newline_to_br | replace: "<br />", " " | strip_newlines | truncate: 1500 }}{% endif %}{% else %}GitHub returned an unexpected response.{% endif %}

  - id: list_issue_comments
    title: List Issue Comments
    description: Read the 5 newest comments on an issue in the connected GitHub repository, such as maintainer replies, workarounds, or fix announcements. Use the issue number from Search Issues.
    http_method: GET
    endpoint_url: https://api.github.com/repos/${{ inputs.owner }}/${{ inputs.repo }}/issues/{{ issue_number | url_encode }}/comments?per_page=100
    auth_type: bearer
    auth_config:
      token: ${{ secrets.access_token }}
    param_schema:
      - name: issue_number
        type: integer
        description: The issue number without the # sign, such as 1234.
        required: true
    response_template: |-
      {% if response.first.id %}{% assign comments = response | reverse %}{% for comment in comments limit: 5 %}- {{ comment.created_at }} · {{ comment.user.login | default: "unknown" }}{% if comment.author_association == "OWNER" or comment.author_association == "MEMBER" or comment.author_association == "COLLABORATOR" %} (maintainer){% endif %}: {{ comment.body | newline_to_br | replace: "<br />", " " | strip_newlines | truncate: 600 }}
      {% endfor %}{% if response.size == 100 %}This issue has more than 100 comments, so newer ones may be missing.{% endif %}{% elsif response.size == 0 %}No comments on this issue.{% else %}GitHub returned an unexpected response.{% endif %}

  - id: list_releases
    title: List Releases
    description: List the 5 newest releases of the connected GitHub repository with their release notes. Use this when a customer asks which version includes a fix or feature, or what changed recently.
    http_method: GET
    endpoint_url: https://api.github.com/repos/${{ inputs.owner }}/${{ inputs.repo }}/releases?per_page=5
    auth_type: bearer
    auth_config:
      token: ${{ secrets.access_token }}
    response_template: |-
      {% if response.first.id %}{% for release in response limit: 5 %}{% unless release.draft %}- {{ release.name | default: release.tag_name }} (tag {{ release.tag_name }}){% if release.prerelease %}, pre-release{% endif %} · published {{ release.published_at | default: "unknown" }}
        Link: {{ release.html_url }}{% if release.body and release.body != "" %}
        Notes: {{ release.body | newline_to_br | replace: "<br />", " " | strip_newlines | truncate: 600 }}{% endif %}
      {% endunless %}{% endfor %}{% elsif response.size == 0 %}This repository has no releases.{% else %}GitHub returned an unexpected response.{% endif %}

  - id: get_latest_release
    title: Get Latest Release
    description: Check the latest stable release of the connected GitHub repository, with its version, date, and release notes. Use this when a customer asks what the current version is.
    http_method: GET
    endpoint_url: https://api.github.com/repos/${{ inputs.owner }}/${{ inputs.repo }}/releases/latest
    auth_type: bearer
    auth_config:
      token: ${{ secrets.access_token }}
    response_template: |-
      {% if response.tag_name %}{{ response.name | default: response.tag_name }} (tag {{ response.tag_name }})
      Published: {{ response.published_at | default: "unknown" }}
      Link: {{ response.html_url }}{% if response.body and response.body != "" %}
      Notes: {{ response.body | newline_to_br | replace: "<br />", " " | strip_newlines | truncate: 2000 }}{% endif %}{% else %}GitHub returned an unexpected response.{% endif %}
