version: 0.0.1
kind: captain_toolset
name: ShipEngine
author: chatwoot
category: Shipping
description: Track packages, look up shipping labels and shipments, and validate addresses in ShipEngine.

secrets:
  api_key:
    label: ShipEngine API key
    type: password
    required: true

tools:
  - id: track_package
    title: Track Package
    description: Get the tracking status, delivery dates, and the 8 most recent scan events for any package by carrier code and tracking number. Use this when a customer asks where their package is and gives a tracking number. Prefer Track Label when you have a ShipEngine label ID.
    http_method: GET
    endpoint_url: 'https://api.shipengine.com/v1/tracking?carrier_code={{ carrier_code | strip | downcase | url_encode }}&tracking_number={{ tracking_number | strip | remove: " " | url_encode }}'
    auth_type: api_key
    auth_config:
      location: header
      name: API-Key
      key: ${{ secrets.api_key }}
    param_schema:
      - name: carrier_code
        type: string
        description: The ShipEngine carrier code, such as stamps_com (USPS), ups, fedex, or dhl_express. Label tools and List Carriers return it.
        required: true
      - name: tracking_number
        type: string
        description: The carrier's tracking number.
        required: true
    response_template: |-
      {% if response.tracking_number or response.status_code %}Tracking {{ response.tracking_number }}{% if response.carrier_code %} ({{ response.carrier_code }}){% endif %}
      Status: {{ response.status_description | default: response.status_code }}{% if response.status_detail_description %} · {{ response.status_detail_description }}{% endif %}{% if response.carrier_status_description %} · carrier says: {{ response.carrier_status_description | truncate: 140 }}{% endif %}
      {% if response.exception_description %}Exception: {{ response.exception_description | truncate: 200 }}
      {% endif %}{% if response.ship_date %}Shipped: {{ response.ship_date }}
      {% endif %}{% if response.actual_delivery_date %}Delivered: {{ response.actual_delivery_date }}
      {% elsif response.estimated_delivery_date %}Estimated delivery: {{ response.estimated_delivery_date }}
      {% endif %}{% if response.tracking_url %}Track: {{ response.tracking_url }}
      {% endif %}{% if response.events.size > 0 %}{% assign events = response.events | sort: "occurred_at" | reverse %}Recent events:
      {% for event in events limit: 8 %}- {{ event.occurred_at }} · {{ event.description | default: event.status_description | truncate: 140 }}{% if event.city_locality and event.city_locality != "" %} ({{ event.city_locality }}{% if event.state_province and event.state_province != "" %}, {{ event.state_province }}{% endif %}{% if event.country_code and event.country_code != "" %} {{ event.country_code }}{% endif %}){% endif %}{% if event.signer %} · signed by {{ event.signer }}{% endif %}
      {% endfor %}{% else %}No scan events yet.{% endif %}{% else %}ShipEngine returned an unexpected response.{% endif %}

  - id: find_labels_by_tracking_number
    title: Find Labels by Tracking Number
    description: Find ShipEngine shipping labels by tracking number. Use this when a customer gives a tracking number and you need the label ID, carrier, label status, or the shipment it belongs to. Then call Track Label for scan events or Get Label for details.
    http_method: GET
    endpoint_url: 'https://api.shipengine.com/v1/labels?tracking_number={{ tracking_number | strip | remove: " " | url_encode }}&page_size=5'
    auth_type: api_key
    auth_config:
      location: header
      name: API-Key
      key: ${{ secrets.api_key }}
    param_schema:
      - name: tracking_number
        type: string
        description: The carrier's tracking number.
        required: true
    response_template: |-
      {% if response.labels %}{% for label in response.labels limit: 5 %}- Label {{ label.label_id }} · {{ label.status }}{% if label.voided and label.status != "voided" %} · voided{% endif %}{% if label.is_return_label %} · return label{% endif %} · created {{ label.created_at }}
        Shipment ID: {{ label.shipment_id }}
        Carrier: {{ label.carrier_code | default: "unknown" }}{% if label.service_code %} · {{ label.service_code | replace: "_", " " }}{% endif %}{% if label.ship_date %} · ship date {{ label.ship_date }}{% endif %}
        Tracking: {{ label.tracking_number | default: "none" }} · {{ label.tracking_status | default: "unknown" | replace: "_", " " }}{% if label.tracking_url %}
        Track: {{ label.tracking_url }}{% endif %}
      {% else %}No label found with this tracking number.
      {% endfor %}{% elsif response.labels == nil %}ShipEngine returned an unexpected response.{% endif %}

  - id: find_labels_by_external_shipment_id
    title: Find Labels by External Shipment ID
    description: Find ShipEngine shipping labels by the external shipment ID the business set when creating the shipment, which is usually its own order or fulfillment reference. Use this when a customer gives an order reference instead of a tracking number.
    http_method: GET
    endpoint_url: https://api.shipengine.com/v1/labels?external_shipment_id={{ external_shipment_id | strip | url_encode }}&page_size=5&sort_by=created_at&sort_dir=desc
    auth_type: api_key
    auth_config:
      location: header
      name: API-Key
      key: ${{ secrets.api_key }}
    param_schema:
      - name: external_shipment_id
        type: string
        description: The business reference stored on the shipment as its external shipment ID, such as an order number.
        required: true
    response_template: |-
      {% if response.labels %}{% for label in response.labels limit: 5 %}- Label {{ label.label_id }} · {{ label.status }}{% if label.voided and label.status != "voided" %} · voided{% endif %}{% if label.is_return_label %} · return label{% endif %} · created {{ label.created_at }}
        Shipment ID: {{ label.shipment_id }}
        Carrier: {{ label.carrier_code | default: "unknown" }}{% if label.service_code %} · {{ label.service_code | replace: "_", " " }}{% endif %}{% if label.ship_date %} · ship date {{ label.ship_date }}{% endif %}
        Tracking: {{ label.tracking_number | default: "none" }} · {{ label.tracking_status | default: "unknown" | replace: "_", " " }}{% if label.tracking_url %}
        Track: {{ label.tracking_url }}{% endif %}
      {% else %}No label found with this external shipment ID.
      {% endfor %}{% elsif response.labels == nil %}ShipEngine returned an unexpected response.{% endif %}

  - id: get_label
    title: Get Label
    description: Get one ShipEngine shipping label with its status, carrier and service, cost, tracking number, tracking status, recipient, and any void or refund details. Use this after a Find Labels tool when a customer asks whether an order shipped or whether a label was refunded.
    http_method: GET
    endpoint_url: https://api.shipengine.com/v1/labels/{{ label_id | strip | url_encode }}
    auth_type: api_key
    auth_config:
      location: header
      name: API-Key
      key: ${{ secrets.api_key }}
    param_schema:
      - name: label_id
        type: string
        description: The ShipEngine label ID from a Find Labels tool, starting with se-.
        required: true
    response_template: |-
      {% if response.label_id %}Label {{ response.label_id }} · {{ response.status }}{% if response.is_return_label %} · return label{% endif %}{% if response.test_label %} · test label{% endif %}
      Created: {{ response.created_at }}{% if response.ship_date %} · Ship date: {{ response.ship_date }}{% endif %}
      Shipment ID: {{ response.shipment_id }}{% if response.external_shipment_id %} · External shipment ID: {{ response.external_shipment_id }}{% endif %}{% if response.external_order_id %} · External order ID: {{ response.external_order_id }}{% endif %}
      Carrier: {{ response.carrier_code | default: "unknown" }}{% if response.service_code %} · {{ response.service_code | replace: "_", " " }}{% endif %}{% if response.package_code %} · {{ response.package_code | replace: "_", " " }}{% endif %}
      Tracking: {{ response.tracking_number | default: "none" }} · {{ response.tracking_status | default: "unknown" | replace: "_", " " }}{% if response.trackable == false %} · this service is not trackable{% endif %}
      {% if response.tracking_url %}Track: {{ response.tracking_url }}
      {% endif %}{% if response.ship_to.name or response.ship_to.city_locality %}Ship to: {{ response.ship_to.name | default: "No name" }} · {{ response.ship_to.city_locality }}, {{ response.ship_to.state_province }} {{ response.ship_to.postal_code }} {{ response.ship_to.country_code }}
      {% endif %}{% if response.shipment_cost.amount %}Shipping cost: {{ response.shipment_cost.amount }} {{ response.shipment_cost.currency | upcase }}{% if response.insurance_cost.amount and response.insurance_cost.amount > 0 %} · insurance {{ response.insurance_cost.amount }} {{ response.insurance_cost.currency | upcase }}{% endif %}
      {% endif %}{% if response.voided %}Voided: {{ response.voided_at | default: "yes" }}{% if response.void_type %} ({{ response.void_type | replace: "_", " " }}){% endif %}
      {% endif %}{% if response.refund_details.refund_status %}Refund: {{ response.refund_details.refund_status | replace: "_", " " }}{% if response.refund_details.amount_approved.amount %} · approved {{ response.refund_details.amount_approved.amount }} {{ response.refund_details.amount_approved.currency | upcase }}{% endif %}
      {% endif %}Packages: {{ response.packages.size | default: 0 }}{% else %}ShipEngine returned an unexpected response.{% endif %}

  - id: track_label
    title: Track Label
    description: Get the current tracking status, delivery dates, and the 8 most recent scan events for a label created in ShipEngine. Use this when a customer asks where their package is and you have a label ID from a Find Labels tool.
    http_method: GET
    endpoint_url: https://api.shipengine.com/v1/labels/{{ label_id | strip | url_encode }}/track
    auth_type: api_key
    auth_config:
      location: header
      name: API-Key
      key: ${{ secrets.api_key }}
    param_schema:
      - name: label_id
        type: string
        description: The ShipEngine label ID, starting with se-.
        required: true
    response_template: |-
      {% if response.tracking_number or response.status_code %}Tracking {{ response.tracking_number }}{% if response.carrier_code %} ({{ response.carrier_code }}){% endif %}
      Status: {{ response.status_description | default: response.status_code }}{% if response.status_detail_description %} · {{ response.status_detail_description }}{% endif %}{% if response.carrier_status_description %} · carrier says: {{ response.carrier_status_description | truncate: 140 }}{% endif %}
      {% if response.exception_description %}Exception: {{ response.exception_description | truncate: 200 }}
      {% endif %}{% if response.ship_date %}Shipped: {{ response.ship_date }}
      {% endif %}{% if response.actual_delivery_date %}Delivered: {{ response.actual_delivery_date }}
      {% elsif response.estimated_delivery_date %}Estimated delivery: {{ response.estimated_delivery_date }}
      {% endif %}{% if response.tracking_url %}Track: {{ response.tracking_url }}
      {% endif %}{% if response.events.size > 0 %}{% assign events = response.events | sort: "occurred_at" | reverse %}Recent events:
      {% for event in events limit: 8 %}- {{ event.occurred_at }} · {{ event.description | default: event.status_description | truncate: 140 }}{% if event.city_locality and event.city_locality != "" %} ({{ event.city_locality }}{% if event.state_province and event.state_province != "" %}, {{ event.state_province }}{% endif %}{% if event.country_code and event.country_code != "" %} {{ event.country_code }}{% endif %}){% endif %}{% if event.signer %} · signed by {{ event.signer }}{% endif %}
      {% endfor %}{% else %}No scan events yet.{% endif %}{% else %}ShipEngine returned an unexpected response.{% endif %}

  - id: get_shipment
    title: Get Shipment
    description: Get one ShipEngine shipment with its status, delivery address, items, and service. Use this with the shipment ID from a Find Labels tool or Get Label when the customer asks what was in a package or where it was sent.
    http_method: GET
    endpoint_url: https://api.shipengine.com/v1/shipments/{{ shipment_id | strip | url_encode }}
    auth_type: api_key
    auth_config:
      location: header
      name: API-Key
      key: ${{ secrets.api_key }}
    param_schema:
      - name: shipment_id
        type: string
        description: The ShipEngine shipment ID from a Find Labels tool or Get Label, starting with se-.
        required: true
    response_template: |-
      {% if response.shipment_id %}{% assign to = response.ship_to %}Shipment {{ response.shipment_id }}{% if response.external_shipment_id %} · external ID {{ response.external_shipment_id }}{% endif %}{% if response.external_order_id %} · external order {{ response.external_order_id }}{% endif %}
      Status: {{ response.shipment_status | replace: "_", " " }}{% if response.is_return %} · return shipment{% endif %}
      Created: {{ response.created_at }}{% if response.ship_date %} · Ship date: {{ response.ship_date }}{% endif %}
      Ship to: {{ to.name | default: "No name" }}{% if to.company_name %}, {{ to.company_name }}{% endif %}{% if to.email %} <{{ to.email }}>{% endif %}
      Address: {{ to.address_line1 }}{% if to.address_line2 %}, {{ to.address_line2 }}{% endif %}, {{ to.city_locality }}, {{ to.state_province }} {{ to.postal_code }} {{ to.country_code }}
      {% if response.service_code %}Service: {{ response.service_code | replace: "_", " " }}
      {% endif %}{% if response.confirmation and response.confirmation != "none" %}Delivery confirmation: {{ response.confirmation | replace: "_", " " }}
      {% endif %}{% if response.tags.size > 0 %}Tags: {% for tag in response.tags limit: 10 %}{{ tag.name }}{% unless forloop.last %}, {% endunless %}{% endfor %}
      {% endif %}Packages: {{ response.packages.size | default: 0 }}
      Items:
      {% for item in response.items limit: 15 %}- {{ item.quantity }} × {{ item.name | truncate: 80 }}{% if item.sku and item.sku != "" %} · SKU {{ item.sku }}{% endif %}
      {% else %}- No items listed.
      {% endfor %}{% else %}ShipEngine returned an unexpected response.{% endif %}

  - id: validate_address
    title: Validate Address
    description: Check whether a shipping address is valid and get the corrected, standardized version. Use this when a customer gives or changes a delivery address, or when a package was returned as undeliverable. This does not change any shipment.
    http_method: POST
    endpoint_url: https://api.shipengine.com/v1/addresses/validate
    auth_type: api_key
    auth_config:
      location: header
      name: API-Key
      key: ${{ secrets.api_key }}
    param_schema:
      - name: address_line1
        type: string
        description: The street address, such as 525 S Winchester Blvd.
        required: true
      - name: address_line2
        type: string
        description: Apartment, suite, or unit, if any.
        required: false
      - name: city
        type: string
        description: The city or locality.
        required: true
      - name: state
        type: string
        description: The state, province, or region, such as CA.
        required: true
      - name: postal_code
        type: string
        description: The postal or ZIP code.
        required: false
      - name: country_code
        type: string
        description: The two-letter ISO country code, such as US.
        required: true
    request_template: |-
      {% capture bs %}\{% endcapture %}{% capture escaped_bs %}\\\\{% endcapture %}{% capture escaped_quote %}\"{% endcapture %}{% assign address_line1 = address_line1 | strip_newlines | strip | replace: bs, escaped_bs | replace: '"', escaped_quote %}{% assign address_line2 = address_line2 | strip_newlines | strip | replace: bs, escaped_bs | replace: '"', escaped_quote %}{% assign city = city | strip_newlines | strip | replace: bs, escaped_bs | replace: '"', escaped_quote %}{% assign state = state | strip_newlines | strip | replace: bs, escaped_bs | replace: '"', escaped_quote %}{% assign postal_code = postal_code | strip_newlines | strip | replace: bs, escaped_bs | replace: '"', escaped_quote %}{% assign country_code = country_code | strip_newlines | strip | upcase | replace: bs, escaped_bs | replace: '"', escaped_quote %}[{"address_line1":"{{ address_line1 }}"{% if address_line2 != "" %},"address_line2":"{{ address_line2 }}"{% endif %},"city_locality":"{{ city }}","state_province":"{{ state }}"{% if postal_code != "" %},"postal_code":"{{ postal_code }}"{% endif %},"country_code":"{{ country_code }}"}]
    response_template: |-
      {% assign result = response.first %}{% if result.status %}Result: {{ result.status }}
      {% if result.matched_address %}{% assign match = result.matched_address %}Matched address: {{ match.address_line1 }}{% if match.address_line2 and match.address_line2 != "" %}, {{ match.address_line2 }}{% endif %}, {{ match.city_locality }}, {{ match.state_province }} {{ match.postal_code }} {{ match.country_code }}
      {% if match.address_residential_indicator == "yes" %}Type: residential
      {% elsif match.address_residential_indicator == "no" %}Type: commercial
      {% endif %}{% else %}No matching address was found.
      {% endif %}{% for message in result.messages limit: 5 %}- {{ message.type }}: {{ message.message | truncate: 200 }}
      {% endfor %}{% else %}ShipEngine returned an unexpected response.{% endif %}

  - id: list_carriers
    title: List Carriers
    description: List the carriers connected to the ShipEngine account, with the carrier code Track Package needs. Use this when a customer asks which carriers the business ships with, or to find the right carrier code.
    http_method: GET
    endpoint_url: https://api.shipengine.com/v1/carriers?include_extended_details=false&page_size=50
    auth_type: api_key
    auth_config:
      location: header
      name: API-Key
      key: ${{ secrets.api_key }}
    response_template: |-
      {% if response.carriers %}{% for carrier in response.carriers limit: 50 %}- {{ carrier.friendly_name | default: carrier.carrier_code }}{% if carrier.nickname and carrier.nickname != "" %} "{{ carrier.nickname | truncate: 40 }}"{% endif %} (carrier code: {{ carrier.carrier_code }}){% if carrier.primary %} · primary{% endif %}{% if carrier.connection_status and carrier.connection_status != "approved" %} · {{ carrier.connection_status | replace: "_", " " }}{% endif %}
      {% else %}No carriers are connected.
      {% endfor %}{% elsif response.carriers == nil %}ShipEngine returned an unexpected response.{% endif %}
